<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            padding: 30px;
        }
        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin: 5px;
        }
        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #2563eb;
            color: white;
        }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>
    <h3>Add New Student</h3>

    <form method="POST">
        {% csrf_token %}
        <input name="name" placeholder="Student Name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="course" placeholder="Course" required>
        <button type="submit">Add Student</button>
    </form>

    <h2>Student Records</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>
                <a href="{% url 'edit_student' student.id %}">Edit</a>
                <form method="POST"
                      action="{% url 'delete_student' student.id %}"
                      style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No student records found.</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
